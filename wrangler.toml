name = "alexanders-ai-api"
main = "worker/index.js"
compatibility_date = "2025-02-14"

[observability]
enabled = true

# Serve the static frontend assets alongside the /api/* Worker endpoints
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/alexanders_knowledge_base.txt", "/worker/*", "/wrangler.toml"]

# Cloudflare Workers AI binding (used as server-side fallback for guest turns if GUEST_PUTER_TOKEN is unset)
[ai]
binding = "AI"

# 1. Server-side 5-Message Guest Quota KV Binding
[[kv_namespaces]]
binding = "GUEST_QUOTA_KV"
id = "33824ff954ef4115878616faf4e64dad"

# 2. Temporary Weekly Chat Turn Logs KV Binding (Partitioned by ISO Week e.g. 2026-W47)
[[kv_namespaces]]
binding = "WEEKLY_LOGS_KV"
id = "f7ac5c4b9b5343a38d2b03db8f7a399f"

# Optional R2 Bucket Binding for Append-Style Weekly Logs (supported by StorageAdapter)
# [[r2_buckets]]
# binding = "WEEKLY_LOGS_BUCKET"
# bucket_name = "alexanders-weekly-chat-logs"

[vars]
COOKIE_SECRET = "alexanders-hmac-sha256-prod-secret-9f4c8e2a1b7d6035e8a9c4f1d2b708e6"
GUEST_PUTER_TOKEN = "PUT_YOUR_GUEST_PUTER_TOKEN_HERE"
